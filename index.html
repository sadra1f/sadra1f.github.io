<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="robots" content="noindex,nofollow" />

    <meta name="theme-color" content="#262626" />
    <meta name="msapplication-navbutton-color" content="#262626" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#262626" />

    <title>Sadra Saderi</title>

    <style>
      body {
        background: #e5e5e5;
        color: #262626;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          Roboto,
          Helvetica Neue,
          Arial,
          Noto Sans,
          sans-serif,
          Apple Color Emoji,
          Segoe UI Emoji,
          Segoe UI Symbol,
          Noto Color Emoji;
      }

      a {
        color: #2563eb;
        text-decoration: underline;
        text-underline-offset: 2px;
        transition: color 0.15s ease;
      }

      a:visited {
        color: #7c3aed;
      }

      a:hover {
        color: #1d4ed8;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }

      a:active {
        color: #1e40af;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #262626;
          color: #e5e5e5;
        }

        a {
          color: #60a5fa;
          text-decoration: underline;
          text-underline-offset: 2px;
          transition: color 0.15s ease;
        }

        a:visited {
          color: #a78bfa;
        }

        a:hover {
          color: #93c5fd;
        }

        a:focus-visible {
          outline: 2px solid currentColor;
          outline-offset: 2px;
        }

        a:active {
          color: #bfdbfe;
        }
      }

      .container {
        min-height: 100vh;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <p>
        Hello!
        <br />
        There's nothing here for now...
      </p>
      <div>
        <a href="https://github.com/sadra1f">https://github.com/sadra1f</a>
      </div>
    </div>
  </body>
</html>
